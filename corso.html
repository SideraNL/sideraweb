<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corso — Sidera s.r.l.</title>
  <meta name="description" content="Programma, sede, destinatari e iscrizione del corso ECM.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>S</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidera.css">
</head>
<body>
  <div class="top">
    <header class="wrap nav">
      <a class="nav-logo" href="index.html"><img src="img/logo_bianco.png" alt="Sidera"></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav class="nav-links" id="menu" aria-label="Pagine del sito">
        <a href="corsi.html" aria-current="page">Corsi ECM</a>
        <a href="regolamento.html">Regolamento</a>
        <a href="app.html">Sidera APP</a>
        <a href="qualita.html">Qualità</a>
        <a href="presentazione.html">Chi siamo</a>
      </nav>
    </header>
    <div class="wrap detail-head">
      <a class="back" href="corsi.html">← Tutti i corsi</a>
      <div class="state" id="stato" style="color: var(--on-dark)">Caricamento del corso…</div>
      <div class="detail-hero" id="testa" hidden></div>
    </div>
  </div>

  <main class="wrap page" id="corpo" hidden>
    <div class="split">
      <section class="split-main card">
        <h2 style="margin-bottom: 8px">Programma</h2>
        <div id="programma"></div>
      </section>
      <aside class="split-side side" id="lato"></aside>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span>© 2026 Sidera s.r.l. · Provider ECM n. 84 · ISO 9001 ITALCERT</span>
      <nav aria-label="Collegamenti">
        <a href="regolamento.html">Regolamento</a>
        <a href="privacy.html">Privacy</a>
        <a href="codice-etico.html">Codice etico</a>
        <a href="mailto:info@sideraweb.it">info@sideraweb.it</a>
      </nav>
    </div>
  </footer>

  <script src="js/sidera.js"></script>
  <script>
  (function () {
    // Dettaglio: sideraecm.eu/corso.php?id=IDPGT (solo eventi pubblicati).
    var S = window.Sidera;
    var PIN = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
    var SCHERMO = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';
    var PALAZZO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9D4E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto;margin-top:2px"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>';
    var CAMERA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>';
    var INFO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M12 16h.01"/></svg>';

    function qs(n) { var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; }
    function errore(msg) { var s = document.getElementById('stato'); s.textContent = msg; s.hidden = false; }

    // «NICOLAUS HOTEL BARI – VIA CARDINALE A. CIASCA, 27 – 70124 BARI (BA)» -> nome + indirizzo
    function sede(s) {
      var p = String(s || '').split(/\s+[–—-]\s+/);
      return { nome: p[0] || '', indirizzo: p.slice(1).join(', ') };
    }

    function render(c, ora, oggiServer) {
      document.title = c.titolo + ' — Sidera s.r.l.';
      var col = S.area(c.area), web = S.webinar(c.luogo);
      var d0 = S.data(c.data), d1 = S.data(c.dataFin) || d0;
      var prog = Array.isArray(c.programma) ? c.programma : [];
      var orari = prog.filter(function (x) { return x.oraIn; });
      var giorno1 = orari.filter(function (x) { return String(x.giorno || '1') === String(orari[0] && orari[0].giorno || '1'); });
      var inizio = giorno1.length ? giorno1[0].oraIn : '';
      var fine = giorno1.length ? (giorno1[giorno1.length - 1].oraFin || giorno1[giorno1.length - 1].oraIn) : '';
      var multi = d1 && d0 && d1.getTime() !== d0.getTime();
      var quando = d0 ? (multi ? S.giornoLungo(d0) + ' – ' + S.giornoLungo(d1) : S.giornoLungo(d0) + (inizio ? ' · ' + inizio + (fine && fine !== inizio ? ' – ' + fine : '') : '')) : '';

      // Ora di riferimento = quella del server, corretta per l'orologio del telefono.
      var scarto = ora ? ora - Date.now() / 1000 : 0;
      function adesso() { return Date.now() / 1000 + scarto; }
      var partenza = null;
      if (web && d0 && inizio) {
        var hm = inizio.split(':');
        partenza = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), Number(hm[0]), Number(hm[1] || 0)).getTime() / 1000;
      }
      var sala = c.sala || {};
      var urlSala = S.url(sala.url), urlIscr = S.url(c.linkIscrizione), urlPdf = S.url(c.linkPdf), urlImg = S.url(c.img);
      var salaOggi = web && sala.attiva && sala.giorno && oggiServer && sala.giorno === oggiServer;
      function salaAperta() {
        if (!salaOggi || !urlSala) return false;
        if (!sala.apre || !sala.chiude) return true;
        var t = adesso(); return t >= sala.apre && t <= sala.chiude;
      }
      // Iscrizioni: per i webinar si chiudono quando il webinar parte.
      function iscrizioniAperte() { return urlIscr && !(partenza && adesso() >= partenza); }

      var cred = c.crediti && !/no.?ecm/i.test(c.crediti) && c.crediti !== '0';
      var costo = c.costo && c.costo !== '0' ? '€ ' + S.esc(c.costo) : 'Partecipazione gratuita';
      var sd = (!web && c.sede) ? sede(c.sede) : null;

      document.getElementById('testa').innerHTML =
        (urlImg ? '<img class="detail-cover" src="' + urlImg + '" alt="Locandina del corso ' + S.esc(c.titolo) + '">' : '') +
        '<div class="detail-info">' +
          '<span id="live"></span>' +
          '<span class="city">' + (web ? SCHERMO : PIN) + S.esc(web ? 'Webinar' : c.luogo) + '</span>' +
          '<span class="detail-when">' + S.esc(quando) + '</span>' +
          (sd ? '<a class="detail-venue" href="#sede">' + PALAZZO + '<span><strong>' + S.esc(sd.nome) + '</strong>' + (sd.indirizzo ? '<br>' + S.esc(sd.indirizzo) : '') + '</span></a>' : '') +
          '<h1>' + S.esc(c.titolo) + '</h1>' +
          '<div class="detail-badges">' +
            (c.area ? '<span class="badge" style="background:' + col.madre + '">' + S.esc(S.areaNome(c.area)) + '</span>' : '') +
            '<span class="badge badge-out">' + (web ? 'Webinar' : 'Residenziale') + '</span>' +
            (cred ? '<span class="badge badge-out">' + S.esc(S.crediti(c.crediti)) + ' crediti ECM</span>' : '') +
            '<span class="badge badge-out">' + costo + '</span>' +
          '</div>' +
          (c.sottotitolo ? '<span class="detail-id">' + S.esc(c.sottotitolo) + '</span>' : '') +
          '<div class="hero-actions" style="margin-top: 8px" id="azioni"></div>' +
          (web ? '<p class="detail-note notice">' + INFO + '<span>L\'iscrizione va fatta <strong>prima dell\'inizio</strong> del webinar: non sono accolte iscrizioni durante il webinar.</span></p>' : '') +
        '</div>';

      var ultimo = null;
      function aggiorna() {
        var aperta = salaAperta(), iscr = iscrizioniAperte();
        var chiave = aperta + '|' + iscr;
        if (chiave === ultimo) return;
        ultimo = chiave;
        document.getElementById('live').outerHTML = aperta ? '<span id="live" class="live-tag">Oggi in diretta</span>' : '<span id="live"></span>';
        document.getElementById('azioni').innerHTML =
          (aperta ? '<a class="btn btn-live" href="' + urlSala + '" target="_blank" rel="noopener">' + CAMERA + 'Entra nel webinar</a>' : '') +
          (iscr ? '<a class="btn btn-light" href="' + urlIscr + '" target="_blank" rel="noopener">Iscriviti</a>' : '') +
          (urlPdf ? '<a class="btn btn-ghost" href="' + urlPdf + '" target="_blank" rel="noopener">Scarica la locandina (PDF)</a>' : '');
        lato(aperta);
      }

      // ── Programma: solo l'orario d'inizio di ogni relazione ──
      var giorni = [];
      prog.forEach(function (x) { var g = String(x.giorno || '').trim(); if (g && giorni.indexOf(g) < 0) giorni.push(g); });
      var html = '', corrente = null;
      if (!prog.length) html = '<p class="muted">Programma in via di definizione.</p>';
      prog.forEach(function (x, i) {
        var g = String(x.giorno || '').trim() || '1';
        if (g !== corrente) {
          corrente = g;
          var dg = d0 ? S.piuGiorni(d0, Math.max(0, giorni.indexOf(g))) : null;
          var esatto = giorni.length === 1 || (d0 && d1 && S.piuGiorni(d0, giorni.length - 1).getTime() === d1.getTime());
          html += '<p class="prog-day">' + (giorni.length > 1 ? 'Giorno ' + S.esc(g) + (esatto && dg ? ' · ' : '') : '') + (esatto && dg ? S.giornoLungo(dg) : '') + '</p>';
        }
        if (String(x.tipo || '').toUpperCase() === 'BLOCCO') { html += '<div class="prog-block">' + S.esc(x.titolo) + '</div>'; return; }
        if (!x.relatori && /^\s*pausa/i.test(x.titolo || '')) {
          html += '<div class="prog-row prog-pause"><span class="prog-time">' + S.esc(x.oraIn) + '</span><span>Pausa</span></div>';
          return;
        }
        html += '<div class="prog-row"><span class="prog-time">' + S.esc(x.oraIn) + '</span><div class="prog-text">' +
          '<span class="prog-title">' + S.esc(x.titolo) + '</span>' +
          (x.relatori ? '<span class="prog-people">' + S.esc(S.nomi(x.relatori)) + '</span>' : '') + '</div></div>';
      });
      document.getElementById('programma').innerHTML = html;

      // ── Colonna di destra ──
      function lato(aperta) {
        var h = '';
        if (aperta) {
          h += '<div class="room" id="sala"><h2>Entra nel webinar</h2>' +
            '<p>Oggi il webinar si segue da qui. Ti servono <strong>l\'email con cui ti sei iscritto</strong> e la <strong>password</strong> che hai ricevuto per email: tienile a portata di mano.</p>' +
            '<a class="btn btn-live" href="' + urlSala + '" target="_blank" rel="noopener">' + CAMERA + 'Entra nel webinar</a>' +
            '<p style="font-size:14px">Il pulsante compare 15 minuti prima dell\'inizio, quando apre la sala d\'attesa. Per i crediti serve il collegamento per almeno il <strong>90%</strong> della durata.</p>' +
            '<p class="last">Possono entrare solo gli iscritti: <strong>non sono accolte iscrizioni durante il webinar</strong>.</p></div>';
        } else if (c.videoUrl) {
          // Il video passa da video_hit.php (conta le visioni): preload none, così conta solo chi lo avvia.
          h += '<div class="card"><h2>Video emozionale</h2><video controls playsinline preload="none"' +
            (urlImg ? ' poster="' + urlImg + '"' : '') + ' src="https://sideraecm.eu/video_hit.php?idpgt=' + encodeURIComponent(c.id) +
            '" style="width:100%;border-radius:8px;background:#0E2238"></video></div>';
        }
        if (sd) {
          var maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.sede);
          h += '<div class="card" id="sede"><h2>Sede</h2><div style="font-size:17px;font-weight:700">' + S.esc(sd.nome) + '</div>' +
            (sd.indirizzo ? '<div class="muted" style="font-size:15px;line-height:1.5;margin-top:4px">' + S.esc(sd.indirizzo) + '</div>' : '') +
            '<a href="' + maps + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;margin-top:14px;min-height:44px;font-weight:600;font-size:15px">Apri in Google Maps →</a></div>';
        }
        var gruppi = Array.isArray(c.discipline) ? c.discipline : [];
        if (gruppi.length) {
          var ammessi = String(c.iscrNonEcm || 'AMMESSE').toUpperCase() !== 'NON_AMMESSE';
          h += '<div class="card"><h2>Destinatari</h2><div style="display:flex;flex-direction:column;gap:14px">' +
            gruppi.map(function (g) {
              var el = (g.discipline || []).filter(function (x) { return String(x).toUpperCase() !== String(g.professione).toUpperCase(); });
              return '<div><div class="prof">' + S.esc(S.areaNome(g.professione)) + '</div>' +
                (el.length ? '<div class="prof-list">' + S.esc(el.map(S.areaNome).join(', ')) + '</div>' : '') + '</div>';
            }).join('') + '</div>' +
            '<p class="box-note">' + (ammessi ? 'Aperto anche a chi partecipa senza necessità di crediti ECM' : 'Riservato ai professionisti che partecipano per l\'accreditamento ECM') + '</p></div>';
        }
        var loghi = Array.isArray(c.sponsorLogos) ? c.sponsorLogos.filter(Boolean) : [];
        if (loghi.length) {
          h += '<div class="card"><p class="muted" style="margin:0 0 14px;font-size:14px">Con la sponsorizzazione non condizionante di:</p><div class="sponsor-logos">' +
            loghi.map(function (u) { return S.url(u) ? '<img src="' + S.url(u) + '" alt="Logo dello sponsor" loading="lazy">' : ''; }).join('') + '</div>' +
            (c.codiceSponsor ? '<p class="muted" style="margin:12px 0 0;font-size:13px">' + S.esc(c.codiceSponsor) + '</p>' : '') + '</div>';
        }
        h += '<a class="cta-dark" href="regolamento.html">Prima di partecipare, leggi il Regolamento <span aria-hidden="true">→</span></a>';
        document.getElementById('lato').innerHTML = h;
      }

      document.getElementById('stato').hidden = true;
      document.getElementById('testa').hidden = false;
      document.getElementById('corpo').hidden = false;
      aggiorna();
      // La pagina puo' restare aperta a lungo: sala e iscrizioni si ricontrollano ogni 30".
      if (web) setInterval(aggiorna, 30000);
    }

    var id = qs('id');
    if (!id) { errore('Corso non indicato.'); return; }
    fetch('https://sideraecm.eu/corso.php?id=' + encodeURIComponent(id), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok || !d.corso) throw new Error('non trovato');
        render(d.corso, d.ora, d.oggi);
      })
      .catch(function () { errore('Corso non trovato o non più disponibile.'); });
  })();
  </script>
</body>
</html>
