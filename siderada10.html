<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#004aad">
  <title>SideraDA10</title>
  <link rel="icon" href="img/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #004aad;
      --accent: #00d2ff;
      --success: #2e7d32;
      --error: #c62828;
      --warning: #f57f17;
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #212121;
      --text2: #757575;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Header --- */
    .header {
      width: 100%; max-width: 480px;
      background: var(--primary);
      color: #fff;
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .header img { height: 36px; }
    .header .title { font-size: 18px; font-weight: 700; }
    .header .ver { font-size: 11px; opacity: .7; }

    /* --- Card --- */
    .card {
      width: 100%; max-width: 480px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 20px;
      margin: 12px 16px;
    }
    .card-title {
      font-size: 14px; font-weight: 700; color: var(--primary);
      margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px;
    }

    /* --- Setup card --- */
    .setup-row {
      display: flex; gap: 10px; align-items: flex-end;
    }
    .setup-row .field { flex: 1; }
    .setup-row label {
      display: block; font-size: 12px; color: var(--text2);
      margin-bottom: 4px; font-weight: 500;
    }
    .setup-row input {
      width: 100%; padding: 10px 12px;
      border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: 16px; font-family: inherit;
      transition: border-color .2s;
    }
    .setup-row input:focus {
      outline: none; border-color: var(--primary);
    }
    .btn {
      padding: 10px 20px;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: opacity .2s, transform .1s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-error   { background: var(--error); color: #fff; }
    .btn-outline {
      background: transparent; color: var(--text2);
      border: 2px solid #e0e0e0;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-lg {
      padding: 16px 24px; font-size: 18px; width: 100%;
      justify-content: center;
    }

    /* --- Project badge --- */
    .project-badge {
      display: none;
      background: var(--primary); color: #fff;
      padding: 8px 16px; border-radius: 8px;
      font-size: 14px; font-weight: 500;
      margin-bottom: 12px;
      align-items: center; gap: 8px;
    }
    .project-badge.active { display: flex; }
    .project-badge .id { font-weight: 700; font-size: 18px; }
    .project-badge .close {
      margin-left: auto; cursor: pointer;
      opacity: .7; font-size: 20px;
    }
    .project-badge .close:hover { opacity: 1; }

    /* --- Scanner --- */
    #reader {
      width: 100%; max-width: 400px;
      margin: 0 auto; border-radius: 8px; overflow: hidden;
    }
    .scanner-wrap { display: none; }
    .scanner-wrap.active { display: block; }

    /* --- Decision panel --- */
    .decision {
      display: none; text-align: center;
    }
    .decision.active { display: block; }
    .decision .cf-display {
      font-size: 20px; font-weight: 700;
      background: #f0f4ff; padding: 12px;
      border-radius: 8px; margin-bottom: 16px;
      letter-spacing: 1px; word-break: break-all;
    }
    .decision .btn-row {
      display: flex; gap: 12px; margin-bottom: 12px;
    }
    .decision .btn-row .btn { flex: 1; }

    /* --- Toast --- */
    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #323232; color: #fff;
      padding: 14px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      transition: transform .3s ease;
      z-index: 999; max-width: 90%;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--error); }
    .toast.warning { background: var(--warning); color: #000; }

    /* --- Log --- */
    .log-wrap { max-height: 200px; overflow-y: auto; margin-top: 12px; }
    .log-entry {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    .log-entry .badge {
      padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 700; color: #fff;
      min-width: 32px; text-align: center;
    }
    .log-entry .badge.in  { background: var(--success); }
    .log-entry .badge.out { background: var(--error); }
    .log-entry .time { color: var(--text2); margin-left: auto; font-size: 12px; }

    /* --- Spinner --- */
    .spinner {
      display: none; text-align: center; padding: 20px;
    }
    .spinner.active { display: block; }
    .spinner::after {
      content: ''; display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- PAX panel --- */
    .pax-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 100;
      justify-content: center; align-items: flex-start;
      padding: 20px;
    }
    .pax-overlay.active { display: flex; }
    .pax-panel {
      width: 100%; max-width: 480px; max-height: 85vh;
      background: var(--card); border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
      display: flex; flex-direction: column; margin-top: 10px;
    }
    .pax-header {
      padding: 16px 20px; border-bottom: 1px solid #e0e0e0;
      display: flex; align-items: center; gap: 10px;
    }
    .pax-header .card-title { margin: 0; flex: 1; }
    .pax-close {
      background: none; border: none; cursor: pointer;
      font-size: 24px; color: var(--text2); padding: 0;
    }
    .pax-search {
      margin: 12px 16px 8px; padding: 10px 14px;
      border: 2px solid #e0e0e0; border-radius: 8px;
      font-size: 16px; font-family: inherit; width: calc(100% - 32px);
    }
    .pax-search:focus { outline: none; border-color: var(--primary); }
    .pax-list {
      flex: 1; overflow-y: auto; padding: 0 8px 12px;
    }
    .pax-item {
      display: flex; align-items: center; padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0; cursor: pointer;
      border-radius: 6px; gap: 10px;
      transition: background .15s;
    }
    .pax-item:active { background: #e8f0fe; }
    .pax-item .info { flex: 1; }
    .pax-item .name { font-weight: 600; font-size: 15px; }
    .pax-item .cf { font-size: 12px; color: var(--text2); letter-spacing: .5px; }
    .pax-item .sel-icon {
      color: var(--primary); font-size: 22px; opacity: .6;
    }
    .pax-count {
      text-align: center; font-size: 12px; color: var(--text2);
      padding: 4px 0 8px;
    }
    .pax-pct {
      padding: 2px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .pax-pct.ok  { background: var(--success); }
    .pax-pct.no  { background: var(--error); }
    .pax-pct.abs { background: #bdbdbd; }

    /* --- Login overlay --- */
    .login-overlay {
      display: none; position: fixed; inset: 0;
      background: linear-gradient(135deg, #004aad 0%, #002a66 100%);
      z-index: 300;
      justify-content: center; align-items: center;
      padding: 20px;
    }
    .login-overlay.active { display: flex; }
    .login-panel {
      width: 100%; max-width: 360px;
      background: var(--card); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      padding: 28px 24px; text-align: center;
    }
    .login-panel .login-logo {
      font-size: 22px; font-weight: 700; color: var(--primary);
      margin-bottom: 6px;
    }
    .login-panel .login-sub {
      font-size: 12px; color: var(--text2); margin-bottom: 22px;
    }
    .login-panel .login-icon {
      font-size: 44px; color: var(--primary); margin-bottom: 10px;
    }
    .login-panel input.login-pin {
      width: 100%; padding: 14px 16px;
      border: 2px solid #e0e0e0; border-radius: 10px;
      font-size: 22px; font-family: inherit; font-weight: 700;
      text-align: center; letter-spacing: 8px;
      margin-bottom: 14px;
      -webkit-text-security: disc;
      -moz-text-security: disc;
      text-security: disc;
    }
    .login-panel input.login-pin:focus {
      outline: none; border-color: var(--primary);
    }
    .login-panel .login-err {
      display: none; color: var(--error); font-size: 13px;
      margin-top: -6px; margin-bottom: 12px;
    }
    .login-panel .login-err.show { display: block; }
    .login-panel .btn-login {
      width: 100%; padding: 14px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: opacity .2s;
    }
    .login-panel .btn-login:active { opacity: .8; }
    .login-panel .btn-login:disabled { opacity: .4; }
    .logout-btn {
      background: none; border: none; cursor: pointer;
      color: #fff; opacity: .7; padding: 4px 8px;
      display: flex; align-items: center;
    }
    .logout-btn:active { opacity: 1; }

    /* --- Responsive --- */
    @media (max-width: 500px) {
      .header { border-radius: 0; }
      .card { margin: 8px; }
    }
  </style>
</head>
<body>

  <!-- Login overlay -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-panel">
      <div class="login-icon material-icons">lock</div>
      <div class="login-logo">SideraDA10</div>
      <div class="login-sub">Inserisci PIN di accesso</div>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             class="login-pin" id="login-pin" placeholder="● ● ● ● ● ●"
             onkeydown="if(event.key==='Enter')verificaPin()" autocomplete="off">
      <div class="login-err" id="login-err">PIN non valido</div>
      <button class="btn-login" onclick="verificaPin()">
        <span class="material-icons" style="vertical-align:middle;font-size:18px">login</span>
        Accedi
      </button>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <img src="img/sidera_logo.jpg" alt="Sidera" style="border-radius:6px" onerror="this.style.display='none'">
    <div style="flex:1">
      <div class="title">SideraDA10</div>
      <div class="ver">Scanner Presenze ECM — v2.1</div>
    </div>
    <button class="logout-btn" onclick="logout()" title="Esci" id="btn-logout" style="display:none">
      <span class="material-icons">logout</span>
    </button>
  </div>

  <!-- Project setup -->
  <div class="card" id="card-setup">
    <div class="card-title">Seleziona Progetto</div>
    <div class="project-badge" id="project-badge">
      <span>Progetto:</span>
      <span class="id" id="badge-id"></span>
      <span class="material-icons close" onclick="resetProgetto()">close</span>
    </div>
    <div id="setup-form">
      <!-- Dropdown prossimi eventi -->
      <div id="eventi-dropdown" style="margin-bottom:12px;display:none">
        <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500">Prossimi eventi</label>
        <select id="select-evento" onchange="selezionaDaDropdown()"
                style="width:100%;padding:10px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;cursor:pointer">
          <option value="">— Seleziona evento —</option>
        </select>
      </div>
      <!-- Input manuale -->
      <div style="display:flex;align-items:center;margin-bottom:8px">
        <span style="flex:1;height:1px;background:#e0e0e0"></span>
        <span style="padding:0 10px;font-size:11px;color:var(--text2)">oppure inserisci manualmente</span>
        <span style="flex:1;height:1px;background:#e0e0e0"></span>
      </div>
      <div class="setup-row">
        <div class="field">
          <label>Codice Progetto (ID PGT)</label>
          <input type="text" id="input-idpgt" placeholder="es. 1338" inputmode="numeric"
                 onkeydown="if(event.key==='Enter')setProgetto()">
        </div>
        <button class="btn btn-primary" onclick="setProgetto()">
          <span class="material-icons" style="font-size:18px">check</span> OK
        </button>
      </div>
    </div>
  </div>

  <!-- Scanner -->
  <div class="card scanner-wrap" id="card-scanner">
    <div class="card-title">Scansione QR Code</div>

    <div id="reader"></div>

    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn btn-primary btn-lg" id="btn-scan" onclick="toggleScanner()" style="flex:1">
        <span class="material-icons">qr_code_scanner</span> SCANNER
      </button>
      <button class="btn btn-lg" id="btn-pax" onclick="apriPax()" style="flex:1;background:#7c3aed;color:#fff" disabled>
        <span class="material-icons">people</span> PAX
      </button>
    </div>

    <!-- Decision panel -->
    <div class="decision" id="decision">
      <div id="pax-name" style="display:none;font-size:18px;font-weight:700;color:var(--success);margin-bottom:8px;text-align:center"></div>
      <div id="pax-warning" style="display:none;font-size:14px;color:var(--error);margin-bottom:8px;text-align:center;font-weight:600">
        <span class="material-icons" style="font-size:18px;vertical-align:middle">block</span>
        Partecipante non iscritto
      </div>
      <div class="cf-display" id="cf-display"></div>
      <div class="btn-row" id="btn-row-reg">
        <button class="btn btn-success btn-lg" onclick="registra('IN')">
          <span class="material-icons">login</span> INGRESSO
        </button>
        <button class="btn btn-error btn-lg" onclick="registra('OUT')">
          <span class="material-icons">logout</span> USCITA
        </button>
      </div>
      <button class="btn btn-outline" onclick="annulla()" style="width:100%">
        <span class="material-icons" style="font-size:16px">refresh</span> Annulla / Nuova scansione
      </button>
    </div>

    <div class="spinner" id="spinner"></div>
  </div>

  <!-- Log sessione -->
  <div class="card scanner-wrap" id="card-log">
    <div class="card-title">Registro sessione</div>
    <div class="log-wrap" id="log-wrap">
      <div style="color:var(--text2);font-size:13px;text-align:center;padding:12px">
        Nessuna registrazione in questa sessione
      </div>
    </div>
  </div>

  <!-- PAX overlay -->
  <div class="pax-overlay" id="pax-overlay" onclick="if(event.target===this)chiudiPax()">
    <div class="pax-panel">
      <div class="pax-header">
        <div class="card-title">Partecipanti iscritti</div>
        <button class="pax-close" onclick="chiudiPax()">
          <span class="material-icons">close</span>
        </button>
      </div>
      <input type="text" class="pax-search" id="pax-search"
             placeholder="Cerca per cognome..." oninput="filtraPax()" autocomplete="off">
      <div class="pax-count" id="pax-count"></div>
      <div class="pax-list" id="pax-list"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>
/* ========================================================
   SideraDA10 — Scanner Presenze ECM v1.1
   GitHub Pages + GAS endpoint
   PAX: verifica CF contro lista iscritti
   ======================================================== */

const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzxDPL5nOTryyxaWDfs43dVPFYD4vFhIoQPd5umPGSJYj8OUs4bHvfSYecuMDYbJaF7/exec";
const INACTIVITY_MS = 8 * 60 * 60 * 1000; // 8 ore

let currentProject = null;
let currentSsId    = null;
let currentOrari   = [];      // [{giorno, data, ora_in, ora_out, pause:[{in,out}]}]
let paxList        = [];      // [{cf, cognome, nome, email}, ...]
let paxLoaded      = false;
let eventiData     = [];      // corsi.json con ssId
let html5QrCode    = null;
let scannerAttivo  = false;
let logEntries     = [];
let authPin        = null;    // PIN di sessione (null = non autenticato)
let inactivityTimer = null;
let scansCache     = null;    // null=non caricato, []=vuoto, [...]= caricato

// --- AUTH / LOGIN ---

function _getStoredAuth() {
  try {
    const raw = localStorage.getItem('siderada10_auth');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function _saveAuth(pin) {
  localStorage.setItem('siderada10_auth', JSON.stringify({
    pin: pin, lastActivity: Date.now()
  }));
}

function _touchActivity() {
  if (!authPin) return;
  const a = _getStoredAuth();
  if (a) {
    a.lastActivity = Date.now();
    localStorage.setItem('siderada10_auth', JSON.stringify(a));
  }
}

function _isAuthExpired() {
  const a = _getStoredAuth();
  if (!a || !a.pin) return true;
  return (Date.now() - (a.lastActivity || 0)) > INACTIVITY_MS;
}

function mostraLogin() {
  authPin = null;
  document.getElementById('login-overlay').classList.add('active');
  document.getElementById('btn-logout').style.display = 'none';
  document.getElementById('login-err').classList.remove('show');
  document.getElementById('login-pin').value = '';
  setTimeout(() => document.getElementById('login-pin').focus(), 200);
}

function nascondiLogin() {
  document.getElementById('login-overlay').classList.remove('active');
  document.getElementById('btn-logout').style.display = 'flex';
}

function verificaPin() {
  const pin = (document.getElementById('login-pin').value || '').trim();
  const err = document.getElementById('login-err');
  if (!pin) { err.textContent = 'Inserisci il PIN'; err.classList.add('show'); return; }

  const btn = document.querySelector('.btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-icons" style="vertical-align:middle;font-size:18px">hourglass_empty</span> Verifica…';

  fetch(GAS_ENDPOINT + '?action=auth&pin=' + encodeURIComponent(pin), { redirect: 'follow' })
    .then(r => r.json())
    .then(result => {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons" style="vertical-align:middle;font-size:18px">login</span> Accedi';
      if (result.ok && result.auth) {
        authPin = pin;
        _saveAuth(pin);
        err.classList.remove('show');
        nascondiLogin();
        avviaTimerInattivita();
        // Auto-ripristina progetto se salvato
        autoRestoreProgetto();
      } else {
        err.textContent = 'PIN non valido';
        err.classList.add('show');
        document.getElementById('login-pin').value = '';
        document.getElementById('login-pin').focus();
      }
    })
    .catch(ex => {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-icons" style="vertical-align:middle;font-size:18px">login</span> Accedi';
      err.textContent = 'Errore rete: ' + ex.message;
      err.classList.add('show');
    });
}

function logout() {
  localStorage.removeItem('siderada10_auth');
  sessionStorage.clear();
  if (inactivityTimer) clearInterval(inactivityTimer);
  location.reload();
}

function avviaTimerInattivita() {
  if (inactivityTimer) clearInterval(inactivityTimer);
  // Check ogni minuto se sono passate 8h di inattività
  inactivityTimer = setInterval(() => {
    if (_isAuthExpired()) {
      clearInterval(inactivityTimer);
      inactivityTimer = null;
      toast('Sessione scaduta per inattività', 'warning');
      setTimeout(() => { authPin = null; localStorage.removeItem('siderada10_auth'); location.reload(); }, 1200);
    }
  }, 60000);
}

// Intercetta interazioni per aggiornare lastActivity
['click','keydown','touchstart'].forEach(evt => {
  document.addEventListener(evt, _touchActivity, { passive: true, capture: true });
});

// Check auth all'avvio della pagina
(function initAuth() {
  const a = _getStoredAuth();
  if (a && a.pin && !_isAuthExpired()) {
    authPin = a.pin;
    _touchActivity();
    nascondiLogin();
    avviaTimerInattivita();
    // Ripristina progetto salvato (setTimeout per garantire che il DOM e tutte le funzioni siano pronte)
    setTimeout(autoRestoreProgetto, 0);
  } else {
    if (a) localStorage.removeItem('siderada10_auth');
    mostraLogin();
  }
})();

// --- CARICA EVENTI DA corsi.json ---

(function caricaEventi() {
  fetch('corsi.json?' + Date.now())
    .then(r => r.json())
    .then(eventi => {
      eventiData = eventi;
      const oggi = new Date(); oggi.setHours(0,0,0,0);
      // Solo eventi futuri con ssId
      const prossimi = eventi.filter(e => {
        if (!e.ssId) return false;
        const parts = e.data.split('/');
        if (parts.length !== 3) return false;
        const d = new Date(parts[2], parts[1]-1, parts[0]);
        return d >= oggi;
      }).slice(0, 5);
      if (prossimi.length === 0) return;
      const sel = document.getElementById('select-evento');
      prossimi.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.idPgt;
        opt.textContent = e.idPgt + ' — ' + e.luogo + ' — ' + e.data;
        sel.appendChild(opt);
      });
      document.getElementById('eventi-dropdown').style.display = 'block';
    })
    .catch(() => {});
})();

function selezionaDaDropdown() {
  const sel = document.getElementById('select-evento');
  if (!sel.value) return;
  const evt = eventiData.find(e => e.idPgt === sel.value);
  if (evt && evt.ssId) {
    document.getElementById('input-idpgt').value = sel.value;
    setProgetto(evt.ssId);
  }
}

// --- PROGETTO ---

function setProgetto(ssId) {
  const id = document.getElementById('input-idpgt').value.trim();
  if (!id) { toast('Inserisci un codice progetto', 'warning'); return; }

  // Se non è passato ssId, prova a cercarlo da eventiData
  if (!ssId) {
    const evt = eventiData.find(e => e.idPgt === id);
    ssId = evt ? evt.ssId : null;
  }
  if (!ssId) {
    toast('Progetto non trovato — usa il menu a tendina', 'error');
    return;
  }

  currentProject = id;
  currentSsId = ssId;
  const evt2 = eventiData.find(e => e.idPgt === id);
  currentOrari = (evt2 && evt2.orari) || [];
  paxLoaded = false;
  paxList = [];
  sessionStorage.setItem('siderada10_progetto', id);
  sessionStorage.setItem('siderada10_ssid', ssId);
  document.getElementById('badge-id').textContent = id;
  document.getElementById('project-badge').classList.add('active');
  document.getElementById('setup-form').style.display = 'none';

  // Carica PAX prima di abilitare lo scanner
  caricaPax(ssId);
}

function caricaPax(ssId) {
  if (!authPin) { mostraLogin(); return; }
  document.getElementById('spinner').classList.add('active');
  document.querySelectorAll('.scanner-wrap').forEach(el => el.classList.add('active'));
  document.getElementById('btn-scan').disabled = true;

  const url = GAS_ENDPOINT + '?action=pax&ssId=' + encodeURIComponent(ssId) +
              '&pin=' + encodeURIComponent(authPin);
  fetch(url, { redirect: 'follow' })
    .then(r => r.json())
    .then(result => {
      document.getElementById('spinner').classList.remove('active');
      if (_handleAuthFail(result)) return;
      if (result.ok) {
        paxList = result.pax || [];
        paxLoaded = true;
        document.getElementById('btn-scan').disabled = false;
        document.getElementById('btn-pax').disabled = false;
        toast(paxList.length + ' iscritti caricati', 'success');
      } else {
        toast('Errore PAX: ' + (result.error || 'sconosciuto'), 'error');
        resetProgetto();
      }
    })
    .catch(err => {
      document.getElementById('spinner').classList.remove('active');
      toast('Errore rete PAX: ' + err.message, 'error');
      resetProgetto();
    });
}

// Auto-ripristina progetto (chiamato dopo login riuscito o se auth già valida)
function autoRestoreProgetto() {
  const savedId   = sessionStorage.getItem('siderada10_progetto');
  const savedSsId = sessionStorage.getItem('siderada10_ssid');
  if (savedId && savedSsId) {
    document.getElementById('input-idpgt').value = savedId;
    setProgetto(savedSsId);
  }
}

// Helper: detecta response con auth fallita e forza logout
function _handleAuthFail(result) {
  if (result && result.auth === false) {
    toast('Sessione scaduta — reinserisci il PIN', 'warning');
    setTimeout(() => {
      localStorage.removeItem('siderada10_auth');
      location.reload();
    }, 1200);
    return true;
  }
  return false;
}

function resetProgetto() {
  currentProject = null;
  currentSsId = null;
  paxList = [];
  paxLoaded = false;
  scansCache = null;
  sessionStorage.removeItem('siderada10_progetto');
  sessionStorage.removeItem('siderada10_ssid');
  stopScanner();
  document.getElementById('project-badge').classList.remove('active');
  document.getElementById('setup-form').style.display = '';
  document.getElementById('input-idpgt').value = '';
  document.getElementById('select-evento').value = '';
  document.querySelectorAll('.scanner-wrap').forEach(el => el.classList.remove('active'));
  nascondiDecision();
}

// --- SCANNER QR ---

function toggleScanner() {
  scannerAttivo ? stopScanner() : avviaScanner();
}

function avviaScanner() {
  if (!paxLoaded) { toast('Lista iscritti non caricata', 'warning'); return; }
  nascondiDecision();
  document.getElementById('reader').innerHTML = '';
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    onScanSuccess
  ).then(() => {
    scannerAttivo = true;
    document.getElementById('btn-scan').innerHTML =
      '<span class="material-icons">stop</span> FERMA SCANNER';
  }).catch(err => {
    toast('Errore fotocamera: ' + err, 'error');
  });
}

function stopScanner() {
  if (!html5QrCode || !scannerAttivo) return Promise.resolve();
  return html5QrCode.stop().then(() => {
    html5QrCode.clear();
    html5QrCode = null;
    scannerAttivo = false;
    document.getElementById('btn-scan').innerHTML =
      '<span class="material-icons">qr_code_scanner</span> AVVIA SCANNER';
  }).catch(() => {
    html5QrCode = null;
    scannerAttivo = false;
  });
}

function onScanSuccess(decodedText) {
  stopScanner().then(() => {
    const cf = decodedText.trim().toUpperCase();
    document.getElementById('cf-display').textContent = cf;

    // Verifica CF nella lista PAX
    const found = paxList.find(p => p.cf === cf);
    const nameEl = document.getElementById('pax-name');
    const warnEl = document.getElementById('pax-warning');
    const regRow = document.getElementById('btn-row-reg');
    if (found) {
      nameEl.textContent = found.cognome + ' ' + found.nome;
      nameEl.style.display = 'block';
      warnEl.style.display = 'none';
      regRow.style.display = 'flex';
    } else {
      nameEl.style.display = 'none';
      warnEl.style.display = 'block';
      regRow.style.display = 'none';
    }
    document.getElementById('decision').classList.add('active');
  });
}

function nascondiDecision() {
  document.getElementById('decision').classList.remove('active');
  document.getElementById('cf-display').textContent = '';
  document.getElementById('pax-name').style.display = 'none';
  document.getElementById('pax-warning').style.display = 'none';
  document.getElementById('btn-row-reg').style.display = 'flex';
}

function annulla() {
  nascondiDecision();
  avviaScanner();
}

// --- REGISTRAZIONE ---

function registra(tipo) {
  const cf = document.getElementById('cf-display').textContent;
  if (!cf || !currentProject) return;
  if (!authPin) { mostraLogin(); return; }

  document.querySelectorAll('.decision .btn').forEach(b => b.disabled = true);
  document.getElementById('spinner').classList.add('active');

  _postScan({ idPgt: currentProject, cf: cf, tipo: tipo, pin: authPin })
    .then(result => {
      document.getElementById('spinner').classList.remove('active');
      document.querySelectorAll('.decision .btn').forEach(b => b.disabled = false);
      if (_handleAuthFail(result)) return;

      if (result.ok) {
        _onScanRegistrata(cf, tipo, result.dataOra);
        return;
      }

      // Gestione code di errore
      if (result.code === 'missing_in') {
        _gestisciMissingIn(cf, tipo);
        return;
      }
      if (result.code === 'duplicate_in' || result.code === 'duplicate_out') {
        const found = paxList.find(p => p.cf === cf);
        const nome = found ? found.cognome + ' ' + found.nome : cf;
        toast(nome + ' — ' + (result.error || 'Già registrato'), 'warning');
        return;
      }

      toast('Errore: ' + (result.error || 'sconosciuto'), 'error');
    })
    .catch(err => {
      document.getElementById('spinner').classList.remove('active');
      document.querySelectorAll('.decision .btn').forEach(b => b.disabled = false);
      toast('Errore di rete: ' + err.message, 'error');
    });
}

// Helper POST scansione
function _postScan(payload) {
  return fetch(GAS_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  }).then(r => r.json());
}

// Callback successo scansione live
function _onScanRegistrata(cf, tipo, dataOra) {
  const label = tipo === 'IN' ? 'INGRESSO' : 'USCITA';
  const found = paxList.find(p => p.cf === cf);
  const nome = found ? ' — ' + found.cognome + ' ' + found.nome : '';
  const logs = JSON.parse(sessionStorage.getItem('siderada10_log') || '[]');
  logs.unshift({ cf, tipo, dataOra: dataOra, nome: nome.replace(' — ', '') });
  sessionStorage.setItem('siderada10_log', JSON.stringify(logs));
  alert(cf + nome + ' — ' + label + ' registrato ✓');
  location.reload();
}

// Gestione warning "manca IN" quando l'operatore prova a registrare OUT
function _gestisciMissingIn(cf, tipoRichiesto) {
  const found = paxList.find(p => p.cf === cf);
  const nome = found ? found.cognome + ' ' + found.nome : cf;

  // Trova l'ora_in del giorno di oggi dal programma
  const todayStr = _todayStr();
  const giornoOggi = currentOrari.find(g => g.data === todayStr);
  if (!giornoOggi) {
    toast('Oggi non è un giorno previsto dal programma del corso', 'error');
    return;
  }
  const oraInProposta = giornoOggi.ora_in; // es. "09:00"

  const msg = '⚠ MANCA LA RILEVAZIONE DI INGRESSO\n\n' +
              nome + '\n\n' +
              'Vuoi registrare l\'INGRESSO mancante alle ' + oraInProposta +
              ' (orario di inizio lezione) e poi procedere con l\'USCITA?';

  if (!confirm(msg)) {
    toast('Operazione annullata', 'warning');
    return;
  }

  document.querySelectorAll('.decision .btn').forEach(b => b.disabled = true);
  document.getElementById('spinner').classList.add('active');

  // Step 1: POST backfill IN all'ora schedulata
  const backfillPayload = {
    idPgt: currentProject,
    cf: cf,
    tipo: 'IN',
    backfill: true,
    dataOra: todayStr + ' ' + oraInProposta + ':00',
    pin: authPin
  };

  _postScan(backfillPayload)
    .then(result => {
      if (_handleAuthFail(result)) return;
      if (!result.ok) {
        document.getElementById('spinner').classList.remove('active');
        document.querySelectorAll('.decision .btn').forEach(b => b.disabled = false);
        toast('Errore backfill IN: ' + (result.error || 'sconosciuto'), 'error');
        return;
      }
      // Step 2: POST OUT (ora che c'è l'IN, la validazione passa)
      return _postScan({ idPgt: currentProject, cf: cf, tipo: 'OUT', pin: authPin });
    })
    .then(result2 => {
      if (!result2) return; // errore step 1 già gestito
      document.getElementById('spinner').classList.remove('active');
      document.querySelectorAll('.decision .btn').forEach(b => b.disabled = false);
      if (_handleAuthFail(result2)) return;
      if (result2.ok) {
        _onScanRegistrata(cf, 'OUT', result2.dataOra);
      } else {
        toast('Errore registrazione OUT: ' + (result2.error || 'sconosciuto'), 'error');
      }
    })
    .catch(err => {
      document.getElementById('spinner').classList.remove('active');
      document.querySelectorAll('.decision .btn').forEach(b => b.disabled = false);
      toast('Errore di rete: ' + err.message, 'error');
    });
}

// --- LOG SESSIONE ---

function renderLog() {
  const wrap = document.getElementById('log-wrap');
  if (logEntries.length === 0) return;
  wrap.innerHTML = logEntries.map(e => {
    const cls = e.tipo === 'IN' ? 'in' : 'out';
    const ora = e.dataOra ? e.dataOra.split(' ')[1] || '' : '';
    const nome = e.nome ? ' — ' + e.nome : '';
    return '<div class="log-entry">' +
      '<span class="badge ' + cls + '">' + e.tipo + '</span>' +
      '<span>' + e.cf + nome + '</span>' +
      '<span class="time">' + ora + '</span>' +
    '</div>';
  }).join('');
}

(function restoreLog() {
  const saved = JSON.parse(sessionStorage.getItem('siderada10_log') || '[]');
  if (saved.length > 0) {
    logEntries = saved;
    renderLog();
  }
})();

// --- TOAST ---

// --- PAX MANUALE ---

function apriPax() {
  if (!paxLoaded || !paxList.length) { toast('Lista iscritti non disponibile', 'warning'); return; }
  stopScanner();
  nascondiDecision();
  document.getElementById('pax-search').value = '';
  document.getElementById('pax-overlay').classList.add('active');
  setTimeout(() => document.getElementById('pax-search').focus(), 200);

  if (scansCache !== null) { filtraPax(); return; }

  const url = GAS_ENDPOINT + '?action=scans&idPgt=' + encodeURIComponent(currentProject) +
              '&pin=' + encodeURIComponent(authPin);
  fetch(url, { redirect: 'follow' })
    .then(r => r.json())
    .then(result => {
      if (_handleAuthFail(result)) return;
      scansCache = result.ok ? (result.scans || []) : [];
      filtraPax();
    })
    .catch(() => { scansCache = []; filtraPax(); });
}

function chiudiPax() {
  document.getElementById('pax-overlay').classList.remove('active');
}

function filtraPax() {
  const q = (document.getElementById('pax-search').value || '').trim().toLowerCase();
  const filtered = q
    ? paxList.filter(p => p.cognome.toLowerCase().includes(q) || p.nome.toLowerCase().includes(q) || p.cf.toLowerCase().includes(q))
    : paxList.slice().sort((a, b) => a.cognome.localeCompare(b.cognome));
  document.getElementById('pax-count').textContent = filtered.length + ' di ' + paxList.length;
  const list = document.getElementById('pax-list');
  if (!filtered.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px;font-size:14px">Nessun risultato</div>';
    return;
  }
  const pctMap = scansCache !== null ? _calcolaPresenzePax(scansCache) : null;
  list.innerHTML = filtered.map(p => {
    let badge = '';
    if (pctMap) {
      const pct = pctMap[p.cf];
      if (pct === null) {
        badge = '<span class="pax-pct abs">0%</span>';
      } else {
        badge = '<span class="pax-pct ' + (pct >= 90 ? 'ok' : 'no') + '">' + pct + '%</span>';
      }
    }
    return '<div class="pax-item" onclick="selezionaPax(\'' + p.cf + '\')">' +
      '<div class="info">' +
        '<div class="name">' + p.cognome + ' ' + p.nome + '</div>' +
        '<div class="cf">' + p.cf + '</div>' +
      '</div>' +
      badge +
      '<span class="material-icons sel-icon">arrow_forward</span>' +
    '</div>';
  }).join('');
}

function selezionaPax(cf) {
  chiudiPax();
  // Simula scansione: popola il pannello decisione come onScanSuccess
  document.getElementById('cf-display').textContent = cf;
  const found = paxList.find(p => p.cf === cf);
  const nameEl = document.getElementById('pax-name');
  const warnEl = document.getElementById('pax-warning');
  const regRow = document.getElementById('btn-row-reg');
  if (found) {
    nameEl.textContent = found.cognome + ' ' + found.nome;
    nameEl.style.display = 'block';
    warnEl.style.display = 'none';
    regRow.style.display = 'flex';
  } else {
    nameEl.style.display = 'none';
    warnEl.style.display = 'block';
    regRow.style.display = 'none';
  }
  document.getElementById('decision').classList.add('active');
}

function _todayStr() {
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') + '/' +
         String(d.getMonth()+1).padStart(2,'0') + '/' +
         d.getFullYear();
}

function _parseHhmm(s) {
  if (!s) return 0;
  const p = s.split(':');
  return parseInt(p[0]) * 60 + (parseInt(p[1]) || 0);
}

function _nowMin() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

function _calcolaPresenzePax(scans) {
  if (!currentOrari.length) return {};
  const today = _todayStr();
  const nowMin = _nowMin();

  const dayInfo = {};
  let plannedTotal = 0;
  currentOrari.forEach(g => {
    const oIn = _parseHhmm(g.ora_in), oOut = _parseHhmm(g.ora_out);
    let pauseMins = 0;
    (g.pause || []).forEach(p => { pauseMins += _parseHhmm(p.out) - _parseHhmm(p.in); });
    dayInfo[g.data] = { oIn, oOut, pause: g.pause || [], planned: Math.max(0, oOut - oIn - pauseMins) };
    plannedTotal += dayInfo[g.data].planned;
  });
  if (plannedTotal === 0) return {};

  const byDay = {};
  scans.forEach(s => {
    const parts = s.dataOra.split(' ');
    if (parts.length < 2) return;
    const dateStr = parts[0], timeStr = parts[1];
    if (!dayInfo[dateStr]) return;
    if (!byDay[s.cf]) byDay[s.cf] = {};
    if (!byDay[s.cf][dateStr]) byDay[s.cf][dateStr] = [];
    byDay[s.cf][dateStr].push({ tipo: s.tipo, time: _parseHhmm(timeStr) });
  });

  const result = {};
  paxList.forEach(p => {
    const days = byDay[p.cf] || {};
    if (!Object.keys(days).length) { result[p.cf] = null; return; }
    let totalNet = 0;
    Object.keys(days).forEach(dateStr => {
      const di = dayInfo[dateStr];
      if (!di) return;
      const ins  = days[dateStr].filter(s => s.tipo === 'IN').sort((a,b) => a.time - b.time);
      const outs = days[dateStr].filter(s => s.tipo === 'OUT').sort((a,b) => a.time - b.time);
      if (!ins.length) return;
      const isToday = dateStr === today;
      const realOut = (isToday && ins.length > outs.length) ? nowMin
        : (outs.length ? outs[outs.length - 1].time : di.oOut);
      const ecmIn = Math.max(ins[0].time, di.oIn);
      const ecmOut = Math.min(realOut, di.oOut);
      if (ecmOut <= ecmIn) return;
      let pov = 0;
      (di.pause || []).forEach(pa => {
        const pIn = _parseHhmm(pa['in']), pOut = _parseHhmm(pa.out);
        const ovS = Math.max(ecmIn, pIn), ovE = Math.min(ecmOut, pOut);
        if (ovE > ovS) pov += ovE - ovS;
      });
      totalNet += Math.max(0, (ecmOut - ecmIn) - pov);
    });
    result[p.cf] = Math.min(100, Math.round((totalNet / plannedTotal) * 100));
  });
  return result;
}

// --- TOAST ---

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || '') + ' show';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3500);
}
